<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 1160 310" font-family="Noto Sans JP, sans-serif" font-size="22">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0bac4"/>
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d55e00"/>
    </marker>
  </defs>
  <!-- boxes (same as fig-system) -->
  <rect x="0" y="70" width="200" height="110" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="100" y="116" text-anchor="middle" font-weight="700">上流データソース</text>
  <text x="100" y="152" text-anchor="middle" fill="#1a2733" font-size="18">40 以上</text>
  <rect x="250" y="70" width="200" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="350" y="116" text-anchor="middle" font-weight="700">raw</text>
  <text x="350" y="152" text-anchor="middle" fill="#1a2733" font-size="18">取得したままの形式</text>
  <rect x="500" y="70" width="220" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="610" y="116" text-anchor="middle" font-weight="700">extracted</text>
  <text x="610" y="152" text-anchor="middle" fill="#1a2733" font-size="18">共通スキーマに正規化</text>
  <rect x="770" y="70" width="200" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="870" y="116" text-anchor="middle" font-weight="700">vuls.db</text>
  <text x="870" y="152" text-anchor="middle" fill="#1a2733" font-size="18">検知用 DB</text>
  <rect x="1020" y="70" width="140" height="110" rx="8" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="1090" y="116" text-anchor="middle" font-weight="700">公開</text>
  <text x="1090" y="152" text-anchor="middle" fill="#1a2733" font-size="18">Vuls で検知</text>
  <!-- forward arrows, faded -->
  <line x1="200" y1="125" x2="248" y2="125" stroke="#b0bac4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="225" y="56" text-anchor="middle" fill="#8a97a3" font-weight="700">fetch</text>
  <line x1="450" y1="125" x2="498" y2="125" stroke="#b0bac4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="56" text-anchor="middle" fill="#8a97a3" font-weight="700">extract</text>
  <line x1="720" y1="125" x2="768" y2="125" stroke="#b0bac4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="745" y="56" text-anchor="middle" fill="#8a97a3" font-weight="700">db build</text>
  <line x1="970" y1="125" x2="1018" y2="125" stroke="#b0bac4" stroke-width="2" marker-end="url(#arr)"/>
  <!-- identifier each artifact carries -->
  <text x="350" y="210" text-anchor="middle" fill="#d55e00" font-weight="700" font-size="18">Git commit</text>
  <text x="610" y="210" text-anchor="middle" fill="#d55e00" font-weight="700" font-size="18">Git commit</text>
  <text x="870" y="210" text-anchor="middle" fill="#d55e00" font-weight="700" font-size="18">digest</text>
  <text x="1090" y="210" text-anchor="middle" fill="#d55e00" font-weight="700" font-size="18">検知結果 JSON</text>
  <!-- backward trace line -->
  <line x1="1090" y1="244" x2="874" y2="244" stroke="#d55e00" stroke-width="3" marker-end="url(#arr-back)"/>
  <line x1="870" y1="244" x2="614" y2="244" stroke="#d55e00" stroke-width="3" marker-end="url(#arr-back)"/>
  <line x1="610" y1="244" x2="354" y2="244" stroke="#d55e00" stroke-width="3" marker-end="url(#arr-back)"/>
  <line x1="350" y1="244" x2="102" y2="244" stroke="#d55e00" stroke-width="3" marker-end="url(#arr-back)"/>
  <line x1="350" y1="234" x2="350" y2="254" stroke="#d55e00" stroke-width="3"/>
  <line x1="610" y1="234" x2="610" y2="254" stroke="#d55e00" stroke-width="3"/>
  <line x1="870" y1="234" x2="870" y2="254" stroke="#d55e00" stroke-width="3"/>
  <line x1="1090" y1="234" x2="1090" y2="254" stroke="#d55e00" stroke-width="3"/>
  <!-- what links each hop -->
  <text x="980" y="282" text-anchor="middle" fill="#1a2733" font-weight="700" font-size="18">検知結果が持つ</text>
  <text x="980" y="306" text-anchor="middle" fill="#1a2733" font-size="17">使った DB の digest</text>
  <text x="740" y="282" text-anchor="middle" fill="#1a2733" font-weight="700" font-size="18">DB が持つ</text>
  <text x="740" y="306" text-anchor="middle" fill="#1a2733" font-size="17">データソースごとの</text>
  <text x="740" y="328" text-anchor="middle" fill="#1a2733" font-size="17">extracted の commit</text>
  <text x="480" y="282" text-anchor="middle" fill="#1a2733" font-weight="700" font-size="18">extracted が持つ</text>
  <text x="480" y="306" text-anchor="middle" fill="#1a2733" font-size="17">元になった raw の commit</text>
  <text x="225" y="282" text-anchor="middle" fill="#1a2733" font-weight="700" font-size="18">commit を checkout</text>
  <text x="225" y="306" text-anchor="middle" fill="#1a2733" font-size="17">= その時点の上流の姿</text>
</svg>
