<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" font-family="Noto Sans JP, sans-serif" font-size="18">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2733"/>
    </marker>
  </defs>
  <!-- 上流 -->
  <rect x="10" y="60" width="170" height="90" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="95" y="96" text-anchor="middle" font-weight="700">上流データソース</text>
  <text x="95" y="126" text-anchor="middle" fill="#1a2733" font-size="15">40+ ソース</text>
  <!-- raw -->
  <rect x="260" y="60" width="190" height="90" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="355" y="96" text-anchor="middle" font-weight="700">raw</text>
  <text x="355" y="126" text-anchor="middle" fill="#1a2733" font-size="15">取得したままの形式</text>
  <!-- extracted -->
  <rect x="530" y="60" width="190" height="90" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="625" y="96" text-anchor="middle" font-weight="700">extracted</text>
  <text x="625" y="126" text-anchor="middle" fill="#1a2733" font-size="15">共通スキーマに正規化</text>
  <!-- DB -->
  <rect x="800" y="60" width="170" height="90" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="885" y="96" text-anchor="middle" font-weight="700">vuls.db</text>
  <text x="885" y="126" text-anchor="middle" fill="#1a2733" font-size="15">検知用 DB</text>
  <!-- scanner -->
  <rect x="1030" y="60" width="120" height="90" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="1090" y="96" text-anchor="middle" font-weight="700">Vuls</text>
  <text x="1090" y="126" text-anchor="middle" fill="#1a2733" font-size="15">検知</text>
  <!-- arrows with labels -->
  <line x1="180" y1="105" x2="258" y2="105" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="219" y="50" text-anchor="middle" fill="#0072b2" font-weight="700">fetch</text>
  <line x1="450" y1="105" x2="528" y2="105" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="489" y="50" text-anchor="middle" fill="#0072b2" font-weight="700">extract</text>
  <line x1="720" y1="105" x2="798" y2="105" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="759" y="50" text-anchor="middle" fill="#0072b2" font-weight="700">db build</text>
  <line x1="970" y1="105" x2="1028" y2="105" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="999" y="50" text-anchor="middle" fill="#0072b2" font-weight="700">公開</text>
  <!-- history band -->
  <rect x="230" y="190" width="520" height="56" rx="8" fill="#fff3c4" stroke="#d6a700" stroke-width="1.5"/>
  <text x="490" y="214" text-anchor="middle" font-weight="700" font-size="16">ソースごとに Git リポジトリとして GHCR に保存</text>
  <text x="490" y="238" text-anchor="middle" fill="#1a2733" font-size="14">全コミット履歴を保持。任意時点の上流の姿を再現できる</text>
  <rect x="780" y="190" width="210" height="56" rx="8" fill="#fff3c4" stroke="#d6a700" stroke-width="1.5"/>
  <text x="885" y="214" text-anchor="middle" font-weight="700" font-size="16">GHCR に保存</text>
  <text x="885" y="238" text-anchor="middle" fill="#1a2733" font-size="14">digest で一意に識別</text>
  <line x1="355" y1="150" x2="355" y2="188" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="625" y1="150" x2="625" y2="188" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="885" y1="150" x2="885" y2="188" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- cadence -->
  <text x="580" y="300" text-anchor="middle" fill="#1a2733" font-size="16">GitHub Actions で fetch → extract → build → 公開を定期的に全自動で回す(CSS 2025 で発表)</text>
</svg>
