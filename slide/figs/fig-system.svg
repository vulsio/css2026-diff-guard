<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 1160 323" font-family="Noto Sans JP, sans-serif" font-size="22">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2733"/>
    </marker>
  </defs>
  <!-- 上流 -->
  <rect x="0" y="70" width="200" height="110" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="100" y="116" text-anchor="middle" font-weight="700">上流データソース</text>
  <text x="100" y="152" text-anchor="middle" fill="#1a2733" font-size="18">40 以上</text>
  <!-- raw -->
  <rect x="250" y="70" width="200" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="350" y="116" text-anchor="middle" font-weight="700">raw</text>
  <text x="350" y="152" text-anchor="middle" fill="#1a2733" font-size="18">取得したままの形式</text>
  <!-- extracted -->
  <rect x="500" y="70" width="220" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="610" y="116" text-anchor="middle" font-weight="700">extracted</text>
  <text x="610" y="152" text-anchor="middle" fill="#1a2733" font-size="18">共通スキーマに正規化</text>
  <!-- DB -->
  <rect x="770" y="70" width="200" height="110" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="870" y="116" text-anchor="middle" font-weight="700">vuls.db</text>
  <text x="870" y="152" text-anchor="middle" fill="#1a2733" font-size="18">検知用 DB</text>
  <!-- scanner -->
  <rect x="1020" y="70" width="140" height="110" rx="8" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="1090" y="116" text-anchor="middle" font-weight="700">公開</text>
  <text x="1090" y="152" text-anchor="middle" fill="#1a2733" font-size="18">Vuls で検知</text>
  <!-- arrows with labels -->
  <line x1="200" y1="125" x2="248" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="225" y="56" text-anchor="middle" fill="#0072b2" font-weight="700">fetch</text>
  <line x1="450" y1="125" x2="498" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="56" text-anchor="middle" fill="#0072b2" font-weight="700">extract</text>
  <line x1="720" y1="125" x2="768" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="745" y="56" text-anchor="middle" fill="#0072b2" font-weight="700">db build</text>
  <line x1="970" y1="125" x2="1018" y2="125" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- history band -->
  <rect x="200" y="230" width="515" height="110" rx="8" fill="#fff3c4" stroke="#d6a700" stroke-width="1.5"/>
  <text x="457" y="262" text-anchor="middle" font-weight="700" font-size="20">Git リポジトリとして全履歴を保持</text>
  <text x="318" y="294" fill="#1a2733" font-size="17">・任意時点の上流の姿を再現できる</text>
  <text x="318" y="322" fill="#1a2733" font-size="17">・データソース単位のリポジトリ</text>
  <rect x="735" y="230" width="270" height="110" rx="8" fill="#fff3c4" stroke="#d6a700" stroke-width="1.5"/>
  <text x="870" y="262" text-anchor="middle" font-weight="700" font-size="20">過去の DB もすべて保持</text>
  <text x="772" y="294" fill="#1a2733" font-size="17">・digest で一意に識別</text>
  <text x="772" y="322" fill="#1a2733" font-size="17">・1 DB は 1 ファイル</text>
  <line x1="350" y1="180" x2="350" y2="228" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="610" y1="180" x2="610" y2="228" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="870" y1="180" x2="870" y2="228" stroke="#d6a700" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
