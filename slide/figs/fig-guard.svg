<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 270" font-family="Noto Sans JP, sans-serif" font-size="18">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2733"/>
    </marker>
  </defs>
  <!-- candidate -->
  <rect x="10" y="30" width="200" height="80" rx="8" fill="#eef4f8" stroke="#0072b2" stroke-width="2"/>
  <text x="110" y="64" text-anchor="middle" font-weight="700">候補 DB</text>
  <text x="110" y="92" text-anchor="middle" fill="#1a2733" font-size="15">今回ビルドしたもの</text>
  <!-- baseline -->
  <rect x="10" y="160" width="200" height="80" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="110" y="194" text-anchor="middle" font-weight="700">baseline</text>
  <text x="110" y="222" text-anchor="middle" fill="#1a2733" font-size="15">直前に公開した DB</text>
  <!-- guard box -->
  <rect x="300" y="30" width="400" height="210" rx="10" fill="#fff8e6" stroke="#d6a700" stroke-width="2"/>
  <text x="500" y="68" text-anchor="middle" font-weight="700">公開前検査 (diff guard)</text>
  <text x="500" y="108" text-anchor="middle" font-size="17">2 つの DB を 3 種の観点でくらべる</text>
  <text x="458" y="160" text-anchor="end" font-size="17">変動率 =</text>
  <text x="545" y="150" text-anchor="middle" font-size="16">追加 + 削除</text>
  <line x1="478" y1="157" x2="612" y2="157" stroke="#1a2733" stroke-width="1.5"/>
  <text x="545" y="176" text-anchor="middle" font-size="16">baseline</text>
  <text x="500" y="216" text-anchor="middle" font-size="16">OS やソースごとに算出、1 つでも閾値超過なら FAIL</text>
  <!-- arrows in -->
  <line x1="210" y1="70" x2="298" y2="70" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="210" y1="200" x2="298" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- outcomes -->
  <line x1="700" y1="100" x2="788" y2="70" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="735" y="68" fill="#1a7f37" font-weight="700" font-size="18">PASS</text>
  <rect x="790" y="30" width="200" height="80" rx="8" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="890" y="64" text-anchor="middle" font-weight="700">公開</text>
  <text x="890" y="92" text-anchor="middle" fill="#1a2733" font-size="13">タグ付け → 次の baseline</text>
  <line x1="700" y1="170" x2="788" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="735" y="218" fill="#d55e00" font-weight="700" font-size="18">FAIL</text>
  <rect x="790" y="160" width="200" height="80" rx="8" fill="#fdebe3" stroke="#d55e00" stroke-width="2"/>
  <text x="890" y="194" text-anchor="middle" font-weight="700">保留</text>
  <text x="890" y="222" text-anchor="middle" fill="#1a2733" font-size="14">タグなし digest で残す</text>
  <!-- human -->
  <line x1="990" y1="200" x2="1058" y2="200" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1060" y="120" width="90" height="150" rx="8" fill="#fff" stroke="#1a2733" stroke-width="2"/>
  <text x="1105" y="175" text-anchor="middle" font-weight="700">人間</text>
  <text x="1105" y="202" text-anchor="middle" fill="#1a2733" font-size="15">レポート</text>
  <text x="1105" y="222" text-anchor="middle" fill="#1a2733" font-size="15">を確認</text>
  <path d="M1105,120 C1105,70 1040,52 992,52" fill="none" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1078" y="40" text-anchor="middle" fill="#1a2733" font-size="14">正当なら promote</text>
</svg>
